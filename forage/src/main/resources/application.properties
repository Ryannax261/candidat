spring.application.name=note-management

# Configuration JSP
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/forage
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Forcer Hibernate a respecter les noms exacts (camelCase) si definis dans @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Initialisation automatique des donnees (data.sql)
# defer = Hibernate cree les tables EN PREMIER, puis data.sql s'execute
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging SQL
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.port=9000